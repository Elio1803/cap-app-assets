  main {
    width: 100%;
    max-width: 40rem;
    display: flex;
    flex-direction: column;
    gap: clamp(2rem, 5vw, 3rem);
  }

  .meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    border-bottom: 1px solid var(--line);
    padding-bottom: 1.1rem;
    font-variant-numeric: tabular-nums;
  }

  .meta .cap {
    color: var(--accent);
    font-weight: 500;
  }

  article {
    font-size: clamp(1.06rem, 1.6vw, 1.2rem);
    line-height: 1.78;
    color: var(--ink);
  }

  article p {
    margin: 0 0 1.35em;
    text-wrap: pretty;
  }

  article p:last-child {
    margin-bottom: 0;
  }

  article p.opening {
    font-style: italic;
    font-size: 1.28em;
    line-height: 1.5;
    color: var(--ink);
    text-wrap: balance;
  }

  article p.opening::first-letter {
    color: var(--accent);
  }

  footer {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .horizon {
    position: relative;
    height: 2px;
    border-radius: 2px;
    overflow: hidden;
    background: var(--line);
  }

  .horizon::after {
    content: "";
    position: absolute;
    inset: 0;
    width: 220%;
    background: linear-gradient(
      90deg,
      transparent 0%,
      var(--accent-soft) 35%,
      var(--accent) 50%,
      var(--accent-soft) 65%,
      transparent 100%
    );
    animation: drift 26s ease-in-out infinite;
  }

  @keyframes drift {
    0% { transform: translateX(-45%); }
    50% { transform: translateX(-15%); }
    100% { transform: translateX(-45%); }
  }

  .signoff {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    .horizon::after {
      animation: none;
      transform: translateX(-30%);
    }
  }

  a { color: var(--accent); }

  ::selection {
    background: var(--accent-soft);
    color: var(--ink);
  }
</style>

<main>
  <div class="meta">
    <span>__DATE_LABEL__</span>
    <span class="cap">Cap</span>
  </div>

  <article>
__ARTICLE_HTML__
  </article>

  <footer>
    <div class="horizon" aria-hidden="true"></div>
    <span class="signoff">06:00 &middot; un jour de plus, un pas de plus</span>
  </footer>
</main>
